name: output
on: push
jobs:
    output-job:
        runs-on: ubuntu-latest
        steps:
            - name: echo
              id: check1
              run: echo "test=hello" >> "$GITHUB_OUTPUT"
            - name: output
              id: check2
              run: echo "test=hello2" >> "$GITHUB_OUTPUT"
            - name: check
              run: |
                echo ${{step.check1.outputs.test}}
                echo ${{step.check2.outputs.test}}