name: timeout
on: push

jobs: 
    timeout:
        runs-on: ubuntu-latest
        timeout-minutes: 2  # 2분 후에 workflow 종료
        steps:
            - name: loop
              run: |
                count=0
                while true; do
                    echo "count: $count"
                    count=$(($count+1))
                    sleep 10
                done
              timeout-minutes: 1  # 1분 후에 step 종료
            - name: echo
              run: echo "hello world"