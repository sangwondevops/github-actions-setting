name: timeout
on: push

jobs:
  timeout-job:
    runs-on: ubuntu-latest
    timeout-minutes: 2 # job level time out
    steps:
      - name: loop
        run: |
          count=0
          while true; do
            echo "seconds: $count"
            count=$((count+1))
            sleep 1
          done
        timeout-minutes: 1 # step level time out
      - name: echo
        run: echo hello
