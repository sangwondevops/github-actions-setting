name: workflow_dispatch-workflow
on: 
    workflow_dispatch:
        inputs:
            name:
                description: 'set name'
                required: true # 필수냐?
                default: github-actions'
            environment:
                description: 'set env'
                required: true
                default: 'dev'
                type: choice
                options:
                    - dev
                    - prod
                    - qa

jobs:
    workflow_dispatch-job:
        runs-on: ubuntu-latest
        steps:
            - name: step1
              run: echo "hello world"
            - name: step2
              run: |
                echo "hello world2"
                echo "hello world3"
            - name: echo inputs
              run: |
                echo ${{ github.event.inputs.name }}
                echo ${{ github.event.inputs.environment }}