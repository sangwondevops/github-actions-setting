name: cicd-1
on:
    pull_request:
        types: [opened,synchronize,closed]  
        branches: [dev] 
        paths:
        - 'my-app/**' 
jobs:
    test: # 테스트 작업
        if: github.event.action == 'opened' || github.event.action == 'synchronize'
        runs-on: ubuntu-latest
        steps:
        - name: checkout
          uses: actions/checkout@v4
        - name: setup-node
          uses: actions/setup-node@v3
          with:
            node-version: '18'
        - name: Cache Node.js modules
          uses: actions/cache@v3
          with:
            path: ~/.npm
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
            restore-keys: |
              ${{ runner.os }}-node-
        - name: Install Dependencies
          run: |
            cd my-app
            npm ci
        - name: npm build
          run: |
            cd my-app
            npm run build


    image-build: # 이미지 빌드 작업
        if: github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        permissions: # 권한 설정
            id-token: write 
            contents: read 
        steps:
        - name: checkout
          uses: actions/checkout@v4
        
        - name: aws
          id: credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-region: ${{vars.AWS_REGION}}
            role-to-assume: ${{secrets.AWS_ROLE_TO_ASSUME}}
        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2
          with:
            mask-password: 'true'
        - name: docker build & push
          run: |
            docker build -f Dockerfile -tag ${{secrets.REGISTRY}}/${{vars.REPOSITORY}}:${{github.sha}} .
            docker push ${{secrets.REGISTRY}}/${{vars.REPOSITORY}}:${{github.sha}}


    deploy: # 배포 작업
        runs-on: ubuntu-latest  
        needs: [image-build]  # image-build 스텝이 성공적으로 완료되면 실행
        # 권한 설정
        permissions:
            id-token: write
            contents: read
        steps:
        - name: checkout
          uses: actions/checkout@v4

        - name: aws
          id: credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-region: ${{vars.AWS_REGION}}
            role-to-assume: ${{secrets.AWS_ROLE_TO_ASSUME}}
        - name: setup kubectl
          uses: azure/setup-kubectl@v3
          with:
            version: latest
        - name: setup helm
          uses: azure/setup-helm@v3
          with:
            version: v3.11.1

        - name: access kubernetes
          run: |
            aws eks update-kubeconfig --name ${{vars.EKS_CLUSTER_NAME}} 
        - name: deploy
          id: status
          run: |
            helm upgrade --install my-app kube/my-app --create-namespace --namespace my-app-${{vars.SUFFIX}} \
            --set image.tag=${{github.sha}} \
            --set image.repository=${{vars.REPOSITORY}}/${{vars.REPOSITORY}} 
        - name: notify
          if: always()
          # slack 알림
          uses: slackapi/slack-github-action@v2.0.0
          with:
            webhook: ${{ secrets.SLACK_KEY }}
            webhook-type: incoming-webhook
            payload-templated: true
            payload: |
              {
                "text":"message",
                "blocks":[
                    {
                        "type":"section",
                        "text":{
                            "type":"mrkdwn",
                            "text":"Environment : dev, Deployed : ${{steps.status.outcome}}, Repository : ${{github.repository}}"
                        }
                    }
                    ]
                }